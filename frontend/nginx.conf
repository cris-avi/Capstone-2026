server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para optimizar velocidad y ancho de banda en escuelas
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enrutamiento para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
        # Evitar caché persistente en index.html para reflejar cambios y actualizaciones de versión
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Soporte explícito y tipos MIME para Service Worker (sw.js) y PWA Manifest
    location ~* (sw\.js|service-worker\.js|manifest\.json|manifest\.webmanifest)$ {
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Caché estática para activos multimedia, tipografías y bundles CSS/JS
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Redirección de errores 404 a index.html para navegación accesible cliente
    error_page 404 /index.html;

    # Bloquear acceso a archivos y carpetas ocultas
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
